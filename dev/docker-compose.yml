x-openedx-service:
  &openedx-service
  image: openedx-dev:18.1.4
  stdin_open: true
  tty: true
  volumes:
    # theme files
    - ../build/openedx/themes:/openedx/themes

services:
  permissions:
    environment:
      OPENEDX_USER_ID: "1000"

  lms:
    <<: *openedx-service
    command: ./manage.py lms runserver 0.0.0.0:8000
    environment:
        DJANGO_SETTINGS_MODULE: lms.envs.tutor.development
    ports:
        - "8000:8000"
    networks:
      default:
        aliases:
          - "local.edly.io"

  cms:
    <<: *openedx-service
    command: ./manage.py cms runserver 0.0.0.0:8000
    environment:
        DJANGO_SETTINGS_MODULE: cms.envs.tutor.development
    ports:
        - "8001:8000"

  # Additional service for watching theme changes
  watchthemes:
    <<: *openedx-service
    command: npm run watch-sass
    restart: unless-stopped

  

  discovery:
    environment:
      DJANGO_SETTINGS_MODULE: course_discovery.settings.tutor.development
    command: ./manage.py runserver 0.0.0.0:8381
    stdin_open: true
    tty: true
    ports:
      - "8381:8381"
    networks:
      default:
        aliases:
          - "discovery.local.edly.io"
  mfe:
      ports:
          - 1984:8002 # communications
          - 2002:8002 # discussions
          - 1994:8002 # gradebook
          - 1993:8002 # ora-grading
  authn: # Work on this MFE for development
      image: "docker.io/overhangio/openedx-authn-dev:18.0.2"
      ports:
          - "1999:1999"
      stdin_open: true
      tty: true
      volumes:
          - ../plugins/mfe/apps/mfe/webpack.dev-tutor.config.js:/openedx/app/webpack.dev-tutor.config.js:ro
          - /home/haseeb/openedx/frontend-app-authn:/openedx/app
      restart: unless-stopped
      depends_on:
          - lms
      environment:
          - "PORT=1999"
  account: # Work on this MFE for development
      image: "docker.io/overhangio/openedx-account-dev:18.0.2"
      ports:
          - "1997:1997"
      stdin_open: true
      tty: true
      volumes:
          - ../plugins/mfe/apps/mfe/webpack.dev-tutor.config.js:/openedx/app/webpack.dev-tutor.config.js:ro
          - /home/haseeb/openedx/frontend-app-account:/openedx/app
      restart: unless-stopped
      depends_on:
          - lms
      environment:
          - "PORT=1997"
  course-authoring: # Work on this MFE for development
      image: "docker.io/overhangio/openedx-course-authoring-dev:18.0.2"
      ports:
          - "2001:2001"
      stdin_open: true
      tty: true
      volumes:
          - ../plugins/mfe/apps/mfe/webpack.dev-tutor.config.js:/openedx/app/webpack.dev-tutor.config.js:ro
          - /home/haseeb/openedx/frontend-app-course-authoring:/openedx/app
      restart: unless-stopped
      depends_on:
          - lms
      environment:
          - "PORT=2001"
  learner-dashboard: # Work on this MFE for development
      image: "docker.io/overhangio/openedx-learner-dashboard-dev:18.0.2"
      ports:
          - "1996:1996"
      stdin_open: true
      tty: true
      volumes:
          - ../plugins/mfe/apps/mfe/webpack.dev-tutor.config.js:/openedx/app/webpack.dev-tutor.config.js:ro
          - /home/haseeb/openedx/frontend-app-learner-dashboard:/openedx/app
      restart: unless-stopped
      depends_on:
          - lms
      environment:
          - "PORT=1996"
  learning: # Work on this MFE for development
      image: "docker.io/overhangio/openedx-learning-dev:18.0.2"
      ports:
          - "2000:2000"
      stdin_open: true
      tty: true
      volumes:
          - ../plugins/mfe/apps/mfe/webpack.dev-tutor.config.js:/openedx/app/webpack.dev-tutor.config.js:ro
          - /home/haseeb/openedx/frontend-app-learning:/openedx/app
      restart: unless-stopped
      depends_on:
          - lms
      environment:
          - "PORT=2000"
  profile: # Work on this MFE for development
      image: "docker.io/overhangio/openedx-profile-dev:18.0.2"
      ports:
          - "1995:1995"
      stdin_open: true
      tty: true
      volumes:
